name: Update README

on:
  # Deliberately manual. This table publishes whatever is pinned, so a daily
  # schedule would advertise stale pins the moment the pins drift.
  # schedule:
  #   - cron: "17 22 * * *" # 06:17 Singapore time, daily
  workflow_dispatch: # run by hand after changing pins

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh currently-building table"
            git push
          else
            echo "No change to commit."
          fi
