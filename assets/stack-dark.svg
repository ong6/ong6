<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" role="img" aria-label="How I build agent systems: data and tools feed an agent runtime, whose output passes a deterministic boundary before reaching an interface.">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; }
    .lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.09em; fill: #e6edf3; }
    .sub { font-size: 10.5px; fill: #8b949e; }
    .cap { font-size: 11.5px; fill: #8b949e; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
    .hi  { fill: #0f2b28; stroke: #2dd4bf; stroke-width: 1.5; rx: 8; }
    .arw { stroke: #30363d; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#30363d"/>
    </marker>
  </defs>
  <rect width="860" height="230" fill="#0d1117"/>

  <text x="24" y="34" class="t lbl" fill="#2dd4bf">how i build agent systems</text>

  <rect class="box" x="24"  y="66" width="176" height="72"/>
  <text x="112" y="97"  class="t lbl" text-anchor="middle">TOOLS &amp; DATA</text>
  <text x="112" y="116" class="t sub" text-anchor="middle">MCP · gRPC · OLAP</text>

  <path class="arw" d="M204 102 H 236"/>

  <rect class="box" x="242" y="66" width="176" height="72"/>
  <text x="330" y="97"  class="t lbl" text-anchor="middle">AGENT RUNTIME</text>
  <text x="330" y="116" class="t sub" text-anchor="middle">A2A · LangGraph</text>

  <path class="arw" d="M422 102 H 454"/>

  <rect class="hi"  x="460" y="60" width="200" height="84"/>
  <text x="560" y="92"  class="t lbl" text-anchor="middle" fill="#2dd4bf">FACT BOUNDARY</text>
  <text x="560" y="111" class="t sub" text-anchor="middle">claims resolve, or it raises</text>
  <text x="560" y="128" class="t sub" text-anchor="middle" fill="#2dd4bf">← the part I care about</text>

  <path class="arw" d="M664 102 H 696"/>

  <rect class="box" x="702" y="66" width="134" height="72"/>
  <text x="769" y="97"  class="t lbl" text-anchor="middle">INTERFACE</text>
  <text x="769" y="116" class="t sub" text-anchor="middle">React · streaming</text>

  <text x="24" y="180" class="t cap">Rankings are computed deterministically in code. The model is constrained to phrasing them,</text>
  <text x="24" y="199" class="t cap">so a summary can never name the wrong winner.</text>
  <text x="24" y="218" class="t cap" fill="#2dd4bf">correctness over fluency</text>
</svg>
