<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" color="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="How I build agent systems: data and tools feed an agent runtime, whose output passes a deterministic boundary before reaching an interface."><style>text{user-select:none}</style><defs><pattern id="uipack-static-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d1d9e0"/></pattern></defs><rect x="0" y="0" width="860" height="230" fill="#ffffff"/><rect x="0" y="0" width="860" height="230" fill="url(#uipack-static-dots)"/><g transform="translate(0,0)"><defs><marker id="stack-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="stack-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f766e"></path></marker><marker id="stack-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0969da"></path></marker><marker id="stack-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f766e"></path></marker><marker id="stack-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#bf8700"></path></marker></defs><g data-uipack="label"><rect x="20" y="23" width="194" height="17" fill="#ffffff"></rect><text x="24" y="34" text-anchor="start" font-size="12" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" letter-spacing=".06em" fill="#0f766e" fill-opacity="1">HOW I BUILD AGENT SYSTEMS</text></g><g data-uipack="node"><rect x="24" y="64" width="168" height="72" rx="6" fill="#f6f8fa" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="108" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Tools &amp; data</text><text x="108" y="112" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" fill="currentColor" fill-opacity="0.75">MCP · gRPC · OLAP</text></g><g data-uipack="node"><rect x="224" y="64" width="168" height="72" rx="6" fill="#f6f8fa" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="308" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Agent runtime</text><text x="308" y="112" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" fill="currentColor" fill-opacity="0.75">A2A · LangGraph</text></g><g data-uipack="node"><rect x="424" y="64" width="224" height="72" rx="6" fill="#f6f8fa" stroke="#0f766e" stroke-opacity="1" stroke-width="1.25"></rect><text x="536" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">Groundplane</text><text x="536" y="112" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" fill="currentColor" fill-opacity="0.75">claims resolve, or it raises</text></g><g data-uipack="node"><rect x="680" y="64" width="156" height="72" rx="6" fill="#f6f8fa" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="758" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Interface</text><text x="758" y="112" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" fill="currentColor" fill-opacity="0.75">React · streaming</text></g><g><path data-uipack="connector" data-kind="request" d="M194,100 L220,100" fill="none" stroke="#0969da" stroke-opacity="1" stroke-width="1.25" marker-end="url(#stack-head-request)"></path><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#0969da" stroke="#ffffff" stroke-width="1.5"></rect><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M194,100 L212,100" calcMode="linear"></animateMotion></g></g><g><path data-uipack="connector" data-kind="request" d="M394,100 L420,100" fill="none" stroke="#0969da" stroke-opacity="1" stroke-width="1.25" marker-end="url(#stack-head-request)"></path><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#0969da" stroke="#ffffff" stroke-width="1.5"></rect><animateMotion dur="1.6s" begin="-0.6s" repeatCount="indefinite" path="M394,100 L412,100" calcMode="linear"></animateMotion></g></g><path data-uipack="connector" data-kind="response" d="M650,100 L676,100" fill="none" stroke="#0f766e" stroke-opacity="1" stroke-width="1.25" marker-end="url(#stack-head-response)"></path><g data-uipack="packet" data-kind="response"><circle cx="0" cy="0" r="4" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"></circle><animateMotion dur="1.6s" begin="-1.2s" repeatCount="indefinite" path="M650,100 L668,100" calcMode="linear"></animateMotion></g><g data-uipack="label"><rect x="462.425" y="146" width="147.15" height="16" fill="#ffffff"></rect><text x="536" y="156" text-anchor="middle" font-size="11" fill="#0f766e" fill-opacity="1">← the part I care about</text></g><g data-uipack="label"><rect x="20" y="169.5" width="583.575" height="16.5" fill="#ffffff"></rect><text x="24" y="180" text-anchor="start" font-size="11.5" fill="currentColor" fill-opacity="0.8">Rankings are computed deterministically in code. The model is constrained to phrasing them,</text></g><g data-uipack="label"><rect x="20" y="188.5" width="292.625" height="16.5" fill="#ffffff"></rect><text x="24" y="199" text-anchor="start" font-size="11.5" fill="currentColor" fill-opacity="0.8">so a summary can never name the wrong winner.</text></g><g data-uipack="label"><rect x="20" y="207.5" width="159.8" height="16.5" fill="#ffffff"></rect><text x="24" y="218" text-anchor="start" font-size="11.5" fill="#0f766e" fill-opacity="1">correctness over fluency</text></g></g></svg>
